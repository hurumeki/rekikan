name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # エディタと同じバリデーションルールを src/data 全件に適用する。
      # ブラウザは使わないので Playwright のブラウザ導入は不要。
      - name: Validate content data
        run: npm run test:data

      - name: Build
        run: npm run build
