[build]
  command = "npm run build"
  publish = "out"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP for a fully static SPA. No third-party scripts; styles inline due to
    # styled-jsx and CSS modules, so 'unsafe-inline' for style-src only.
    # 'unsafe-inline' for script-src: required by Next.js static export
    # because hydration data is emitted as inline <script> blocks and
    # `output: 'export'` cannot inject a per-request nonce.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
